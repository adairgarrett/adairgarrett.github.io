<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: #0c0d14; overflow: hidden; }
canvas { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let width = canvas.width = 1200;
let height = canvas.height = 800;

// Madrid & Atlanta-Inspired Transit Network Nodes
const stations = [
    { id: 'M_NORT', x: 0.50, y: 0.20, isTransfer: true, name: 'North Interchange' },
    { id: 'M_NE', x: 0.74, y: 0.32, isTransfer: true, name: 'Northeast Station' },
    { id: 'M_SE', x: 0.74, y: 0.68, isTransfer: true, name: 'Southeast Station' },
    { id: 'M_SOUT', x: 0.50, y: 0.80, isTransfer: true, name: 'South Central' },
    { id: 'M_SW', x: 0.26, y: 0.68, isTransfer: true, name: 'Southwest Station' },
    { id: 'M_NW', x: 0.26, y: 0.32, isTransfer: true, name: 'Northwest Station' },
    { id: 'M_CENT', x: 0.50, y: 0.50, isTransfer: true, name: 'Central Interchange' },
    { id: 'T_NORT', x: 0.50, y: 0.08, isTransfer: false, name: 'North Terminal' },
    { id: 'T_SOUT', x: 0.50, y: 0.92, isTransfer: false, name: 'South Terminal' },
    { id: 'T_WEST', x: 0.12, y: 0.50, isTransfer: false, name: 'West Terminal' },
    { id: 'T_EAST', x: 0.88, y: 0.50, isTransfer: false, name: 'East Terminal' }
];

const stationMap = {};
stations.forEach(s => { stationMap[s.id] = s; });

function getRoute(ids) {
    return ids.map(id => stationMap[id]);
}

// Station Interlocking / Block Reservation System
// Prevents any two trains from ever occupying the same station at the same time
const occupiedStations = {};

const lines = [
    {
        id: 'L6',
        name: 'Line 6 Circular (Loop)',
        darkColor: '#bcaee8',
        lightColor: '#7664af',
        points: getRoute(['M_NORT', 'M_NE', 'M_SE', 'M_SOUT', 'M_SW', 'M_NW', 'M_NORT']),
        isLoop: true,
        trains: [
            { id: 'T_L6_1', seg: 0, t: 0.1, dwelling: false, dwellTimer: 0, baseSpeed: 0.0022, dir: 1 },
            { id: 'T_L6_2', seg: 3, t: 0.1, dwelling: false, dwellTimer: 0, baseSpeed: 0.0022, dir: 1 }
        ]
    },
    {
        id: 'L1',
        name: 'Line 1 Central Spine',
        darkColor: '#8190dc',
        lightColor: '#5162c7',
        points: getRoute(['T_NORT', 'M_NORT', 'M_CENT', 'M_SOUT', 'T_SOUT']),
        isLoop: false,
        trains: [
            { id: 'T_L1_1', seg: 0, t: 0.5, dwelling: false, dwellTimer: 0, baseSpeed: 0.0024, dir: 1 },
            { id: 'T_L1_2', seg: 3, t: 0.5, dwelling: false, dwellTimer: 0, baseSpeed: 0.0024, dir: -1 }
        ]
    },
    {
        id: 'L2',
        name: 'Line 2 East-West Cross',
        darkColor: '#a67c8e',
        lightColor: '#885469',
        points: getRoute(['T_WEST', 'M_SW', 'M_CENT', 'M_NE', 'T_EAST']),
        isLoop: false,
        trains: [
            { id: 'T_L2_1', seg: 0, t: 0.2, dwelling: false, dwellTimer: 0, baseSpeed: 0.0023, dir: 1 }
        ]
    }
];

// Draw an Elongated, Cute & Calming Subway Train
function drawElongatedSubwayTrain(x, y, angle, color, isLight, isDwelling) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const trainLen = 56; // Elongated, elegant proportions
    const trainWidth = 14;
    const halfL = trainLen / 2;
    const halfW = trainWidth / 2;

    // Soft Forward Ambient Light Beam
    const beamGrad = ctx.createRadialGradient(halfL + 2, 0, 1, halfL + 24, 0, 16);
    if (isLight) {
        beamGrad.addColorStop(0, 'rgba(81, 98, 199, 0.18)');
        beamGrad.addColorStop(1, 'rgba(81, 98, 199, 0)');
    } else {
        beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
        beamGrad.addColorStop(0.4, 'rgba(129, 144, 220, 0.10)');
        beamGrad.addColorStop(1, 'rgba(129, 144, 220, 0)');
    }
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(halfL, -3.5);
    ctx.lineTo(halfL + 22, -9);
    ctx.lineTo(halfL + 22, 9);
    ctx.lineTo(halfL, 3.5);
    ctx.closePath();
    ctx.fill();

    // Wheel Bogies (Front & Rear trucks)
    ctx.fillStyle = isLight ? '#949ab0' : '#07080f';
    ctx.fillRect(-halfL + 6, -halfW - 1.2, 8, trainWidth + 2.4);
    ctx.fillRect(halfL - 14, -halfW - 1.2, 8, trainWidth + 2.4);

    // Train Body - Sleek Rounded Passenger Car
    ctx.fillStyle = isLight ? '#ffffff' : '#141624';
    ctx.beginPath();
    ctx.roundRect(-halfL, -halfW, trainLen, trainWidth, 4);
    ctx.fill();

    // Outer Stroke
    ctx.strokeStyle = isLight ? '#c5c9e2' : '#2d3352';
    ctx.lineWidth = 1.0;
    ctx.stroke();

    // Center Articulation / Car Divider line (gives subtle 2-car appearance)
    ctx.strokeStyle = isLight ? '#e2e4f0' : '#22263d';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -halfW + 1);
    ctx.lineTo(0, halfW - 1);
    ctx.stroke();

    // Color Waistband Stripe
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(-halfL + 5, -1.8, trainLen - 10, 3.6);

    // 4 Cute Rounded Passenger Windows
    ctx.fillStyle = isLight ? '#475569' : '#e0e7ff';
    ctx.globalAlpha = isDwelling ? 0.9 : (isLight ? 0.40 : 0.75);
    [-18, -7, 7, 18].forEach(wx => {
        ctx.beginPath();
        ctx.roundRect(wx - 2.5, -halfW + 1.2, 5, 2.0, 0.8);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(wx - 2.5, halfW - 3.2, 5, 2.0, 0.8);
        ctx.fill();
    });

    // Front Cab Windshield
    ctx.fillStyle = isLight ? '#3b82f6' : '#8190dc';
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.roundRect(halfL - 5, -halfW + 1.6, 4, trainWidth - 3.2, 1.2);
    ctx.fill();

    // Dual Round Front Headlights
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.arc(halfL - 0.5, -halfW + 2.5, 1.2, 0, Math.PI * 2);
    ctx.arc(halfL - 0.5, halfW - 2.5, 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Dual Red Rear Taillights
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(-halfL + 0.5, -halfW + 2.5, 1.0, 0, Math.PI * 2);
    ctx.arc(-halfL + 0.5, halfW - 2.5, 1.0, 0, Math.PI * 2);
    ctx.fill();

    // Gentle Station Boarding Glow
    if (isDwelling) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.roundRect(-halfL - 2, -halfW - 2, trainLen + 4, trainWidth + 4, 5);
        ctx.stroke();
    }

    ctx.restore();
}

function updateAndDraw() {
    ctx.clearRect(0, 0, width, height);
    const isLight = false;

    // 1. Draw Calm, Clean Metro Lines
    lines.forEach(line => {
        const color = isLight ? line.lightColor : line.darkColor;

        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.4; // Soft & non-distracting
        ctx.globalAlpha = isLight ? 0.22 : 0.28;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        line.points.forEach((p, idx) => {
            const px = p.x * width;
            const py = p.y * height;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        });
        ctx.stroke();
    });

    // 2. Draw Stations
    stations.forEach(st => {
        const sx = st.x * width;
        const sy = st.y * height;

        if (st.isTransfer) {
            ctx.beginPath();
            ctx.arc(sx, sy, 7, 0, Math.PI * 2);
            ctx.fillStyle = isLight ? '#ffffff' : '#0c0d14';
            ctx.globalAlpha = 0.9;
            ctx.fill();

            ctx.strokeStyle = isLight ? '#5162c7' : '#8190dc';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = isLight ? '#5162c7' : '#8190dc';
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = isLight ? '#ffffff' : '#0c0d14';
            ctx.globalAlpha = 0.85;
            ctx.fill();

            ctx.strokeStyle = isLight ? '#8e94a8' : '#8190dc';
            ctx.lineWidth = 1.4;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(sx, sy, 1.8, 0, Math.PI * 2);
            ctx.fillStyle = isLight ? '#5162c7' : '#ffffff';
            ctx.fill();
        }
    });

    // 3. Update Trains with Signal Interlocking (Collision-Free Station Occupancy)
    lines.forEach(line => {
        const color = isLight ? line.lightColor : line.darkColor;
        const totalSegments = line.points.length - 1;

        line.trains.forEach(train => {
            const pStart = line.points[train.seg];
            const nextIdx = line.isLoop 
                ? (train.seg + 1) % line.points.length 
                : (train.dir === 1 ? train.seg + 1 : train.seg - 1);
            const pEnd = line.points[nextIdx];
            const targetStation = train.dir === -1 ? pStart : pEnd;

            if (train.dwelling) {
                // Currently stopped at station
                occupiedStations[targetStation.id] = train.id;
                train.dwellTimer--;

                if (train.dwellTimer <= 0) {
                    // Release station lock upon departure
                    if (occupiedStations[targetStation.id] === train.id) {
                        delete occupiedStations[targetStation.id];
                    }
                    train.dwelling = false;
                    train.t = 0;

                    if (line.isLoop) {
                        train.seg = (train.seg + 1) % totalSegments;
                    } else {
                        train.seg = nextIdx;
                        if (train.seg <= 0) train.dir = 1;
                        if (train.seg >= totalSegments) train.dir = -1;
                    }
                }
            } else {
                // Moving between stations
                const legProgress = train.t;
                let speedFactor = 1.0;

                // Check signal: If station ahead is occupied by another train, hold at 0.88
                const isStationOccupied = occupiedStations[targetStation.id] && occupiedStations[targetStation.id] !== train.id;

                if (isStationOccupied && legProgress >= 0.86) {
                    // Hold train outside station until track clears
                    speedFactor = 0;
                } else {
                    // Gentle, smooth acceleration & deceleration (Slow, peaceful transit cruise)
                    if (legProgress < 0.25) {
                        speedFactor = 0.4 + 0.6 * (legProgress / 0.25);
                    } else if (legProgress > 0.75) {
                        speedFactor = 0.4 + 0.6 * ((1 - legProgress) / 0.25);
                    }
                    train.t += train.baseSpeed * speedFactor;

                    if (train.t >= 1) {
                        train.t = 1;
                        train.dwelling = true;
                        train.dwellTimer = 75; // ~1.25s station stop
                        occupiedStations[targetStation.id] = train.id;
                    }
                }
            }

            const fromP = train.dir === -1 ? pEnd : pStart;
            const toP = train.dir === -1 ? pStart : pEnd;
            const curX = (fromP.x + (toP.x - fromP.x) * train.t) * width;
            const curY = (fromP.y + (toP.y - fromP.y) * train.t) * height;
            const angle = Math.atan2((toP.y - fromP.y) * height, (toP.x - fromP.x) * width);

            drawElongatedSubwayTrain(curX, curY, angle, color, isLight, train.dwelling);
        });
    });

    requestAnimationFrame(updateAndDraw);
}

updateAndDraw();
</script>
</body>
</html>
